<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!--
    PREGAO / pattern-ruled.svg
    Tileable ruled-ledger-paper rules. 64x64 tile, 1px hairlines.
    Neutral warm grey at low alpha so it reads on both ink (#0B0C0E)
    and paper (#F2EDE3) grounds without inverting.
    CSS: background-image:url(pattern-ruled.svg); background-repeat:repeat;
  -->
  <g fill="none" stroke="#8A8478" stroke-width="1">
    <!-- horizontal ledger rules, 16px rhythm -->
    <path d="M0 0.5H64" stroke-opacity="0.22"/>
    <path d="M0 16.5H64" stroke-opacity="0.11"/>
    <path d="M0 32.5H64" stroke-opacity="0.11"/>
    <path d="M0 48.5H64" stroke-opacity="0.11"/>
    <!-- vertical column rules, 64px rhythm (one strong, one hair) -->
    <path d="M0.5 0V64" stroke-opacity="0.16"/>
    <path d="M32.5 0V64" stroke-opacity="0.07"/>
  </g>
  <!-- tick marks in the gutter: auction lot-board cadence -->
  <g fill="#8A8478" fill-opacity="0.14">
    <rect x="4" y="0" width="3" height="1"/>
    <rect x="4" y="32" width="3" height="1"/>
  </g>
</svg>
