<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    SEXTANT / favicon.svg
    The lot mark reduced to pure geometry: a graduated sextant limb, one index
    arm dropped from the pivot, one star fixed in the open sky beside it.
    Two colours only - ink #0B0C0E, brass #FF7A18.
    Tuned for 16px: 3.4px strokes, nothing thinner than 2px, no detail below 4px.
  -->
  <rect width="32" height="32" rx="7" fill="#0B0C0E"/>
  <g stroke="#FF7A18" fill="none" stroke-width="3.4" stroke-linecap="round">
    <!-- the limb: graduated arc, pivot at (16,5.5) r=16.5 -->
    <path d="M4.96 17.76A16.5 16.5 0 0 0 27.04 17.76"/>
    <!-- the index arm, dropped from the pivot to the limb -->
    <path d="M16 7.2 22.71 20.57"/>
  </g>
  <!-- the fixed star -->
  <path d="M9.6 9.4 12.1 12.1 9.6 14.8 7.1 12.1Z" fill="#FF7A18"/>
</svg>
